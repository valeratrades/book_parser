cargo-features = ["codegen-backend"]
[package]
name = "book_parser"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
ask_llm = { path = "/home/v/s/ask_llm", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
color-eyre = "=0.6.5"
dirs = "=7.0.0"
futures = "=0.3.34"
indicatif = "=0.18.6"
miette = { version = "=7.6.0", features = ["fancy", "syntect-highlighter", "serde"] }
quick-xml = { version = "=0.42.0", features = ["escape-html"] }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "charset", "http2"] }
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "process", "fs", "io-util", "time"] }
tracing = "=0.1.44"
v_utils = { version = "=2.20.0", features = ["async-io"] }
zip = "=8.6.0"

[lints.rust]
unused_features = "allow"

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"

[[example]]
name = "test"
path = "./examples/test.rs"
